# Apache VirtualHost example for gucchii.com
#
# Portfolio (Next.js) is proxied to pm2 on port 3000.
# phpMyAdmin must NOT be sent to Next.js (otherwise Next.js returns its default 404).
#
# Replace <PHPMYADMIN_PATH> with your server-only path (do not commit the real value).
# phpMyAdmin itself is configured separately (Alias, Include, etc.).

<VirtualHost *:443>
    ServerName gucchii.com

    ProxyPreserveHost On

    # Exclude phpMyAdmin from the Next.js catch-all proxy (order matters).
    ProxyPass <PHPMYADMIN_PATH> !
    ProxyPassReverse <PHPMYADMIN_PATH> !

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
