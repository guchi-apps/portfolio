name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # UptimeRobot API Keys for build-time data fetching
          # Add these secrets in GitHub Settings -> Secrets and variables -> Actions
          UPTIMEROBOT_MK_PROFILE: ${{ secrets.UPTIMEROBOT_MK_PROFILE }}
          UPTIMEROBOT_MK_BLOG: ${{ secrets.UPTIMEROBOT_MK_BLOG }}
          UPTIMEROBOT_MK_ASSET: ${{ secrets.UPTIMEROBOT_MK_ASSET }}
          # If you use multiple keys like UPTIMEROBOT_MK_SITE_A, add them here:
          # UPTIMEROBOT_MK_SITE_A: ${{ secrets.UPTIMEROBOT_MK_SITE_A }}

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "out/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          # EXCLUDE: "/node_modules/"
