name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  deploy:
    runs-on: ubuntu-latest
    needs: tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .env.tpl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/data
          cp data/site-content.example.json .next/standalone/data/site-content.default.json
          cp deploy/.htaccess .next/standalone/.htaccess
          cp ecosystem.config.js .next/standalone/ecosystem.config.js

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}
          ARGS: "-rlDzvc -i --delete"
          SOURCE: ".next/standalone/"
          REMOTE_HOST: ${{ env.SSH_HOST }}
          REMOTE_USER: ${{ env.SSH_USERNAME }}
          TARGET: ${{ env.DEPLOY_PATH }}
          REMOTE_PORT: ${{ env.SSH_PORT }}
          EXCLUDE: "/data/site-content.json, /data/uploads/"

      - name: Configure and restart application
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          SIGNALY_LOGIN_WEBHOOK_URL: ${{ env.SIGNALY_LOGIN_WEBHOOK_URL }}
          UPTIMEROBOT_READ_ONLY_KEY: ${{ env.UPTIMEROBOT_READ_ONLY_KEY }}
          UPTIMEKUMA_BASE_URL: ${{ env.UPTIMEKUMA_BASE_URL }}
          UPTIMEKUMA_PORTFOLIO_SLUG: ${{ env.UPTIMEKUMA_PORTFOLIO_SLUG }}
          UPTIMEKUMA_DASHBOARD_SLUG: ${{ env.UPTIMEKUMA_DASHBOARD_SLUG }}
          REGISTERED_USERS_DB_HOST: ${{ env.REGISTERED_USERS_DB_HOST }}
          REGISTERED_USERS_DB_PORT: ${{ env.REGISTERED_USERS_DB_PORT }}
          REGISTERED_USERS_DB_USER: ${{ env.REGISTERED_USERS_DB_USER }}
          REGISTERED_USERS_DB_PASSWORD: ${{ env.REGISTERED_USERS_DB_PASSWORD }}
          REGISTERED_USERS_SETTINGS_DB_USER: ${{ env.REGISTERED_USERS_SETTINGS_DB_USER }}
          REGISTERED_USERS_SETTINGS_DB_PASSWORD: ${{ env.REGISTERED_USERS_SETTINGS_DB_PASSWORD }}
          REGISTERED_USERS_SETTINGS_DATABASE: ${{ env.REGISTERED_USERS_SETTINGS_DATABASE }}
          REGISTERED_USERS_MIGRATE_DB_USER: ${{ env.REGISTERED_USERS_MIGRATE_DB_USER }}
          REGISTERED_USERS_MIGRATE_DB_PASSWORD: ${{ env.REGISTERED_USERS_MIGRATE_DB_PASSWORD }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: ADMIN_PASSWORD,SESSION_SECRET,SIGNALY_LOGIN_WEBHOOK_URL,UPTIMEROBOT_READ_ONLY_KEY,UPTIMEKUMA_BASE_URL,UPTIMEKUMA_PORTFOLIO_SLUG,UPTIMEKUMA_DASHBOARD_SLUG,REGISTERED_USERS_DB_HOST,REGISTERED_USERS_DB_PORT,REGISTERED_USERS_DB_USER,REGISTERED_USERS_DB_PASSWORD,REGISTERED_USERS_SETTINGS_DB_USER,REGISTERED_USERS_SETTINGS_DB_PASSWORD,REGISTERED_USERS_SETTINGS_DATABASE,REGISTERED_USERS_MIGRATE_DB_USER,REGISTERED_USERS_MIGRATE_DB_PASSWORD,DEPLOY_PATH
          script: |
            cd "$DEPLOY_PATH"
            {
              printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
              printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
              printf 'SIGNALY_LOGIN_WEBHOOK_URL=%s\n' "$SIGNALY_LOGIN_WEBHOOK_URL"
              printf 'UPTIMEROBOT_READ_ONLY_KEY=%s\n' "$UPTIMEROBOT_READ_ONLY_KEY"
              printf 'UPTIMEKUMA_BASE_URL=%s\n' "$UPTIMEKUMA_BASE_URL"
              printf 'UPTIMEKUMA_PORTFOLIO_SLUG=%s\n' "$UPTIMEKUMA_PORTFOLIO_SLUG"
              printf 'UPTIMEKUMA_DASHBOARD_SLUG=%s\n' "$UPTIMEKUMA_DASHBOARD_SLUG"
              printf 'REGISTERED_USERS_DB_HOST=%s\n' "$REGISTERED_USERS_DB_HOST"
              printf 'REGISTERED_USERS_DB_PORT=%s\n' "$REGISTERED_USERS_DB_PORT"
              printf 'REGISTERED_USERS_DB_USER=%s\n' "$REGISTERED_USERS_DB_USER"
              printf 'REGISTERED_USERS_DB_PASSWORD=%s\n' "$REGISTERED_USERS_DB_PASSWORD"
              printf 'REGISTERED_USERS_SETTINGS_DB_USER=%s\n' "$REGISTERED_USERS_SETTINGS_DB_USER"
              printf 'REGISTERED_USERS_SETTINGS_DB_PASSWORD=%s\n' "$REGISTERED_USERS_SETTINGS_DB_PASSWORD"
              printf 'REGISTERED_USERS_SETTINGS_DATABASE=%s\n' "$REGISTERED_USERS_SETTINGS_DATABASE"
              printf 'REGISTERED_USERS_MIGRATE_DB_USER=%s\n' "$REGISTERED_USERS_MIGRATE_DB_USER"
              printf 'REGISTERED_USERS_MIGRATE_DB_PASSWORD=%s\n' "$REGISTERED_USERS_MIGRATE_DB_PASSWORD"
              printf 'SITE_CONTENT_PATH=%s/data/site-content.json\n' "$DEPLOY_PATH"
              printf 'NODE_ENV=production\n'
              printf 'PORT=3105\n'
              printf 'HOSTNAME=127.0.0.1\n'
            } > .env.production.local
            mkdir -p data/uploads
            if [ ! -f data/site-content.json ]; then
              cp data/site-content.default.json data/site-content.json
            fi
            if command -v pm2 >/dev/null; then
              pm2 delete portfolio 2>/dev/null || true
              pm2 start ecosystem.config.js --env production
              pm2 save
            else
              echo "pm2 is required on the server. Install: npm install -g pm2"
              exit 1
            fi

  notify:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .env.tpl

      - name: Signaly に通知
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.deploy.result }}
          NOTIFY_APP: Portfolio
          NOTIFY_KIND: デプロイ
          NOTIFY_JOB: deploy
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, release]
    if: always() && needs.release.result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .env.tpl

      - name: Signaly に通知
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: Portfolio
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
          NOTIFY_JOB: release
        run: bash .github/scripts/signaly-notify.sh
